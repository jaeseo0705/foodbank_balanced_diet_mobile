name: Validate mobile app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Verify local OCR module autolinking
        run: node scripts/check-ocr-autolinking.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test login and restart behavior
        run: npm test
      - name: Bundle iOS, Android, and web
        run: npm run export
        env:
          CI: '1'
      - name: Select browser for screen checks
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Install Korean fonts for screen captures
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          for weight in Regular Bold; do
            curl --fail --location --retry 2 --max-time 90 \
              "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-${weight}.otf" \
              --output "$HOME/.local/share/fonts/NotoSansCJKkr-${weight}.otf"
          done
          fc-cache -f
      - name: Check browser interactions and layouts
        run: npm run test:web
        env:
          QA_PREVIEW_LOG: '1'
      - name: Save build and screen check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-check-output
          path: |
            dist/
            package-lock.json
            qa-output/
          retention-days: 7
