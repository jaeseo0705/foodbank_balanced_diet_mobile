name: Validate mobile app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Typecheck
        run: npm run typecheck
      - name: Test login and restart behavior
        run: npm test
      - name: Bundle iOS, Android, and web
        run: npm run export
        env:
          CI: '1'
      - name: Install browser for screen checks
        run: npx playwright install --with-deps chromium
      - name: Check browser interactions and layouts
        run: npm run test:web
        env:
          QA_PREVIEW_LOG: '1'
      - name: Save build and screen check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-check-output
          path: |
            dist/
            package-lock.json
            qa-output/
          retention-days: 7
